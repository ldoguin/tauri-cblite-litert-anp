[package]
name = "a2a-core"
version = "0.1.0"
edition = "2021"
description = "The A2A task layer both projects share: the A2A 1.0 JSON-RPC types, the Executor trait an agent implements, the on-device LLM executor (LiteRT-LM), and the control-room demo page"
license = "MIT"

[features]
# On-device LLM executor (LiteRT-LM). Linux/macOS only: Google ships no Windows runtime.
litert = ["dep:litertlm"]

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(not(windows))'.dependencies]
litertlm = { git = "https://github.com/ldoguin/tauri-plugin-litert", optional = true }