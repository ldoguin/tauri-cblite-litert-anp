[package]
name = "anp-group"
version = "0.1.0"
edition = "2021"
description = "ANP-09 P6 (group E2EE) wire layer: the v2 objects, requests and results, AAD and submission bindings, DID-WBA device bindings and RFC 9421 origin proofs. No MLS yet."
license = "MIT"

[dependencies]
anp-did = { path = "../anp-did" }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
ed25519-dalek = "2"