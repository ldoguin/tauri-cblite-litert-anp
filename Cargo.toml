[workspace]
resolver = "2"
# common/: what both projects share; a2a/: the A2A project; anp/: the ANP project (its xtask runs the end-to-end checks)
members = ["common/crates/*", "a2a/crates/*", "anp/crates/*", "anp/xtask"]
# the two desktop apps (a2a/src-tauri, anp/src-tauri) are workspaces of their own

[workspace.dependencies]
couchbase_lite = { git = "https://github.com/ldoguin/couchbase-lite-rust", rev = "6973ec9b8316685b1da1067670c4386484e5d95f", default-features = false }

# the listener's RSA key is generated once per node; that is slow in an unoptimised build
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
