[package]
name = "anp-cblite"
version = "0.1.0"
edition = "2021"
description = "A2A (Agent2Agent) server on Couchbase Lite, with peer-to-peer task routing"
license = "MIT"

[features]
default = ["enterprise"]
# P2P (URLEndpointListener) is a Couchbase Lite Enterprise feature.
enterprise = ["couchbase_lite/enterprise"]
# On-device LLM executor (LiteRT-LM). Linux/macOS only: Google ships no Windows runtime.
litert = ["a2a-core/litert"]

[dependencies]
a2a-core = { path = "../../../common/crates/a2a-core" }
couchbase_lite.workspace = true
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.2"
rsa = { version = "0.9", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
anp-authz = { path = "../anp-authz" }
anp-did = { path = "../anp-did" }
anp-ad = { path = "../anp-ad" }
anp-e2ee = { path = "../anp-e2ee" }
anp-httpauth = { path = "../anp-httpauth" }
anp-resolve = { path = "../anp-resolve" }
anp-wns = { path = "../anp-wns" }
anp-meta = { path = "../anp-meta" }
anp-group-host = { path = "../anp-group-host" }
anp-group = { path = "../anp-group" }
anp-group-mls = { path = "../anp-group-mls" }
anp-coldstore = { path = "../anp-coldstore" }
anp-counterparty = { path = "../anp-counterparty" }
anp-quote = { path = "../anp-quote" }
ureq = { version = "2", default-features = false }

