[package]
name = "anp-resolve"
version = "0.1.0"
edition = "2021"
description = "Resolve did:wba and did:web DIDs over HTTPS (ANP-03): verified, cached, with guards against being used to reach internal hosts"
license = "MIT"

[dependencies]
anp-did = { path = "../anp-did" }
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
rcgen = "0.13"
