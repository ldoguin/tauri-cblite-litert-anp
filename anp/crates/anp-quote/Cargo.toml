[package]
name = "anp-quote"
version = "0.1.0"
edition = "2021"
description = "Signed quotes between agents of different companies: request, quote, accept, confirm, each signed by the sender's did:wba key; acceptances checked against the buyer's spending token; a spend ledger"
license = "MIT"

[dependencies]
anp-did = { path = "../anp-did" }
anp-authz = { path = "../anp-authz" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
sha2 = "0.10"
