[package]
name = "anp-node"
version = "0.1.0"
edition = "2021"

[features]
default = ["enterprise"]
enterprise = ["couchbase_lite/enterprise", "anp-cblite/enterprise"]
# Real agent: on-device LLM (LiteRT-LM). Linux/macOS only - Google ships no Windows runtime.
litert = ["anp-cblite/litert"]

[dependencies]
anp-cblite = { path = "../anp-cblite", default-features = false }
couchbase_lite.workspace = true
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
serde_json = "1"
anp-did = { path = "../anp-did" }
anp-wns = { path = "../anp-wns" }
anp-meta = { path = "../anp-meta" }
