[package]
name = "anp-group-mls"
version = "0.1.0"
edition = "2021"
description = "ANP P6 group E2EE: the MLS session (openmls) under the wire layer of anp-group: key packages that carry the DID-WBA binding, create, add with a welcome, commit, remove, application messages"
license = "MIT"

[dependencies]
anp-group = { path = "../anp-group" }
anp-did = { path = "../anp-did" }
openmls = "=0.8.0"
openmls_rust_crypto = "=0.5.0"
openmls_basic_credential = "0.5.0"
openmls_traits = "0.5.0"
serde_json = "1"
base64 = "0.22"