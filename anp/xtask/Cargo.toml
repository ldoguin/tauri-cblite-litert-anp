[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Project tasks in Rust, run as `cargo xtask <task>`: the end-to-end checks that were PowerShell scripts, on every platform"
publish = false

[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false }
# a test certificate authority and a TLS front for nodes that serve plain HTTP (the discovery checks resolve DIDs over HTTPS)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"